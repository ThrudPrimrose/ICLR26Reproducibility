<title>Skills Ablation Readout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
<style>
:root{
  color-scheme: light;
  --plane:#f7f7f4; --surface:#fcfcfb; --surface-2:#f2f2ee;
  --ink:#14140f; --ink-2:#55554c; --ink-3:#82827a;
  --rule:#e3e3dc; --rule-2:#cfcfc6;
  --m1:#2a78d6; --m2:#eb6834; --m3:#1baf7a;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --pos:#2a78d6; --neg:#d03b3b; --mid:#f0efec;
  --band:#eda10018;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --plane:#0d0d0d; --surface:#1a1a19; --surface-2:#232321;
    --ink:#f7f7f2; --ink-2:#c3c2b7; --ink-3:#8e8d84;
    --rule:#333330; --rule-2:#45453f;
    --m1:#3987e5; --m2:#d95926; --m3:#199e70;
    --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
    --pos:#3987e5; --neg:#d03b3b; --mid:#383835;
    --band:#fab21914;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#0d0d0d; --surface:#1a1a19; --surface-2:#232321;
  --ink:#f7f7f2; --ink-2:#c3c2b7; --ink-3:#8e8d84;
  --rule:#333330; --rule-2:#45453f;
  --m1:#3987e5; --m2:#d95926; --m3:#199e70;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --pos:#3987e5; --neg:#d03b3b; --mid:#383835;
  --band:#fab21914;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--plane); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1080px;margin:0 auto;padding:56px 24px 96px}
h1,h2,h3{font-family:"Source Serif 4",Georgia,serif;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,4.4vw,3.1rem);font-weight:700;line-height:1.08;letter-spacing:-.018em}
h2{font-size:1.42rem;font-weight:600;letter-spacing:-.01em}
h3{font-size:1.02rem;font-weight:600}
p{margin:0}
.eyebrow{
  font-family:"IBM Plex Mono",monospace;font-size:.7rem;font-weight:500;
  letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)
}
.sub{color:var(--ink-2);font-size:1.06rem;max-width:64ch;margin-top:14px}
header{border-bottom:1px solid var(--rule);padding-bottom:30px;margin-bottom:44px}
.meta{
  display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:20px;
  font-family:"IBM Plex Mono",monospace;font-size:.76rem;color:var(--ink-3)
}
.meta b{color:var(--ink-2);font-weight:500}
section{margin-bottom:52px}
.shead{display:flex;align-items:baseline;gap:14px;margin-bottom:6px;flex-wrap:wrap}
.snote{color:var(--ink-2);font-size:.95rem;max-width:70ch;margin-bottom:22px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:22px}
/* verdict */
.verdict{
  background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--ink-3);
  border-radius:10px;padding:28px 30px;display:grid;
  grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:34px;align-items:center
}
.big{font-family:"Source Serif 4",Georgia,serif;font-size:3.5rem;font-weight:700;line-height:1;letter-spacing:-.03em}
.big small{font-size:1rem;font-weight:500;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;letter-spacing:0}
.tally{display:flex;gap:0;height:38px;border-radius:5px;overflow:hidden;margin-top:8px}
.tally div{display:flex;align-items:center;justify-content:center;font-family:"IBM Plex Mono",monospace;font-size:.78rem;font-weight:600;color:#fff}
.tallykey{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap;font-size:.79rem;color:var(--ink-2)}
.tallykey span{display:flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:2px;flex:none}
/* grids */
.multi{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:16px 16px 10px}
.ptitle{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.ptitle h3{font-size:.95rem}
.pstat{font-family:"IBM Plex Mono",monospace;font-size:.74rem;color:var(--ink-3);margin-bottom:10px}
.pstat b{color:var(--ink-2);font-weight:500}
svg{display:block;width:100%;height:auto;overflow:visible}
.gridline{stroke:var(--rule);stroke-width:1}
.axis{stroke:var(--rule-2);stroke-width:1}
.tick{font-family:"IBM Plex Mono",monospace;font-size:9.5px;fill:var(--ink-3)}
.axlabel{font-family:"IBM Plex Sans",sans-serif;font-size:10.5px;fill:var(--ink-3)}
.diag{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3;opacity:.65}
.dot{stroke:var(--surface);stroke-width:2;cursor:pointer}
/* table */
table{width:100%;border-collapse:collapse;font-size:.86rem}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--rule)}
th:first-child,td:first-child{text-align:left}
th{
  font-family:"IBM Plex Mono",monospace;font-size:.68rem;font-weight:500;
  letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);
  border-bottom:1px solid var(--rule-2)
}
td{font-variant-numeric:tabular-nums;font-family:"IBM Plex Mono",monospace;color:var(--ink-2)}
td:first-child{font-family:"IBM Plex Sans",sans-serif;color:var(--ink);font-weight:500}
tr:last-child td{border-bottom:none}
.tag{
  display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:.66rem;
  padding:1px 6px;border-radius:3px;border:1px solid var(--rule-2);color:var(--ink-3);margin-left:6px
}
.scroll{overflow-x:auto}
/* callout */
.callout{
  background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--warning);
  border-radius:10px;padding:20px 24px
}
.callout h3{margin-bottom:8px}
.callout p{color:var(--ink-2);font-size:.93rem;max-width:76ch}
.callout p+p{margin-top:10px}
code{font-family:"IBM Plex Mono",monospace;font-size:.86em;background:var(--surface-2);padding:1px 5px;border-radius:3px;color:var(--ink)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;font-size:.8rem;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:7px}
/* tooltip */
#tip{
  position:fixed;pointer-events:none;opacity:0;transition:opacity .1s;
  background:var(--ink);color:var(--plane);font-family:"IBM Plex Mono",monospace;
  font-size:.73rem;padding:7px 10px;border-radius:5px;z-index:50;white-space:nowrap;
  box-shadow:0 4px 14px #0003
}
footer{border-top:1px solid var(--rule);padding-top:22px;color:var(--ink-3);font-size:.82rem}
@media (max-width:760px){ .verdict{grid-template-columns:1fr} }
</style>
